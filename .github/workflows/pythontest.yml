name: Python tests
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  pre_job:
    name: Path match check
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      # paths-filter needs a checkout to diff push events
      - uses: actions/checkout@v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python:
              - '**.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/pythontest.yml'
  unit_test:
    name: Python unit tests
    needs: pre_job
    if: ${{ needs.pre_job.outputs.python == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        exclude:
          # CPython 3.14 on Windows links zlib-ng, which emits different DEFLATE
          # bytes than the reference zlib; predictable-zip hashes are pinned in
          # Studio, so ricecooker.utils.zip refuses to build archives there.
          - os: windows-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-python: true
          python-version: ${{ matrix.python-version }}
      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get -y -qq update
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y poppler-utils
          sudo apt-get install -y pandoc
          sudo apt-get install -y tmux
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
      - name: Cache Mac dependencies
        uses: actions/cache@v6.1.0
        if: matrix.os == 'macos-latest'
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('.github/workflows/pythontest.yml') }}
      - name: Unlink Homebrew Python 3.13 if not testing 3.13
        if: matrix.os == 'macos-latest' && matrix.python-version != '3.13'
        run: brew unlink python@3.13 || true
      - name: Install Mac dependencies
        run: |
          # Conditionally link python@3.13 to avoid conflicts when testing Python 3.13
          # See: https://github.com/actions/runner-images/issues/9966
          if [[ "${{ matrix.python-version }}" != "3.13" ]]; then
            echo "Linking Homebrew python@3.13"
            # Non-fatal: recent macOS runner images may not ship python@3.13 as a
            # keg, so there is nothing to link. brew install below resolves its own deps.
            brew link --overwrite python@3.13 || true
          else
            echo "Skipping Homebrew python@3.13 linking for Python 3.13 test."
          fi
          brew install ffmpeg poppler pandoc
        if: matrix.os == 'macos-latest'
      - name: Windows dependencies cache
        id: windowscache
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}\tools
          key: ${{ runner.os }}-${{ matrix.python-version }}-tools-${{ hashFiles('.github/workflows/pythontest.yml') }}
      - name: Download Windows dependencies if needed
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Create tools directory if it doesn't exist
          New-Item -Path "tools" -ItemType Directory -Force -ErrorAction SilentlyContinue

          # Check and download FFmpeg if needed
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\tools\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe")) {
            Write-Output "FFmpeg not found, downloading..."
            curl.exe --output ffmpeg.zip -L https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
            7z x ffmpeg.zip -otools -y
          } else {
            Write-Output "FFmpeg already exists, skipping download"
          }

          # Check and download Poppler if needed
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\tools\poppler-21.11.0\Library\bin\pdfinfo.exe")) {
            Write-Output "Poppler not found, downloading..."
            curl.exe --output poppler.zip -L https://github.com/oschwartz10612/poppler-windows/releases/download/v21.11.0-0/Release-21.11.0-0.zip
            7z x poppler.zip -otools -y
          } else {
            Write-Output "Poppler already exists, skipping download"
          }

          # Check and download Pandoc if needed
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\tools\pandoc-3.1.11\pandoc.exe")) {
            Write-Output "Pandoc not found, downloading..."
            curl.exe --output pandoc.zip -L https://github.com/jgm/pandoc/releases/download/3.1.11/pandoc-3.1.11-windows-x86_64.zip
            7z x pandoc.zip -otools -y
          } else {
            Write-Output "Pandoc already exists, skipping download"
          }
      - name: Set paths to Windows dependencies
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\tools\ffmpeg-master-latest-win64-gpl\bin" -Encoding utf8
          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\tools\poppler-21.11.0\Library\bin" -Encoding utf8
          Add-Content -Path $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE\tools\pandoc-3.1.11" -Encoding utf8
      - name: Install Playwright Chromium
        run: uv run --extra screenshots playwright install --with-deps chromium
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
      - name: Run tests
        run: uv run --group test --extra google_drive --extra screenshots pytest
  # Single stable required check: a skipped matrix job reports no per-combination checks.
  required_checks:
    name: Python tests
    needs:
      - pre_job
      - unit_test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
